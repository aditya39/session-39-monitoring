# Local Prometheus + Grafana stack for Session 39.
#
# Usage:
#   cd monitoring
#   docker compose up -d
#
# Then:
#   - Prometheus UI:  http://localhost:9090
#   - Grafana UI:     http://localhost:3000   (login: admin / admin)
#
# Your notebook should be running start_http_server(8000) on the host
# so Prometheus can scrape it via host.docker.internal:8000.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets Prometheus reach the host machine on Linux (Docker Desktop
      # already provides host.docker.internal on Mac and Windows).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: llm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
